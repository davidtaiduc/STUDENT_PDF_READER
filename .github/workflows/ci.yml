name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check environment files
        run: npm run check:secrets
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test without live AI or database
        run: npm test
      - name: Build frontend and typecheck backend
        run: npm run build
      # Deployment is added after choosing Node.js hosting.

      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests with fake services
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence
          path: |
            docs/ui-redesign-2026-11-24/*.png
            tmp/visual-test-results/
          retention-days: 7
